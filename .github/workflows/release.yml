name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag matching MARKETING_VERSION (e.g. v1.0.2). This workflow validates an unnotarized test package and never creates or publishes a release."
        required: true
        # No default: forces an intentional tag that matches project.yml MARKETING_VERSION.


permissions:
  contents: read

env:
  XCODEGEN_VERSION: "2.45.4"
  # SHA-256 of https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
  XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
  RELEASE_ARCH: arm64

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout with full tag history
        # Pin to major v4 tag commit so Dependabot can still propose updates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release tag name
        id: tag
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.tag }}
          PUSH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_EVENT_NAME" in
            workflow_dispatch)
              TAG="$DISPATCH_RELEASE_TAG"
              ;;
            push)
              TAG="$PUSH_RELEASE_TAG"
              ;;
            *)
              printf 'error: unsupported release event: %q\n' "$RELEASE_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          bash scripts/validate-release-tag.sh "$TAG"
          printf 'name=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve release commit
        id: commit
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          bash scripts/validate-release-tag.sh "$TAG"

          git fetch --tags --force origin

          # Always build from the initially selected workflow commit so release
          # tooling matches the sources under test. Never check out a historical tag.
          INTENDED_SHA="$(git rev-parse HEAD)"
          TAG_REF="refs/tags/${TAG}"

          if git rev-parse -q --verify "$TAG_REF" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG_REF")"
            echo "Tag ${TAG} already exists at ${TAG_SHA}"
            if [ "$TAG_SHA" != "$INTENDED_SHA" ]; then
              echo "error: published tags are immutable" >&2
              echo "  ${TAG} points at ${TAG_SHA}" >&2
              echo "  workflow commit is ${INTENDED_SHA}" >&2
              echo "Cut a new version/tag from the commit you want to release." >&2
              exit 1
            fi
            echo "Tag ${TAG} matches this commit; continuing with a quarantined test package"
          else
            echo "error: tag ${TAG} does not exist at this workflow commit" >&2
            echo "This read-only test-package workflow never creates tags." >&2
            exit 1
          fi

          printf 'sha=%s\n' "$INTENDED_SHA" >> "$GITHUB_OUTPUT"
          echo "Building from $(git rev-parse HEAD) for tag ${TAG}"

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${WORK_DIR}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${WORK_DIR}/xcodegen.zip" | shasum -a 256 -c -
          unzip -qo "${WORK_DIR}/xcodegen.zip" -d "${WORK_DIR}"
          # Expose job-local binary so scripts/generate-xcodeproj.sh can find bare `xcodegen`.
          echo "${WORK_DIR}/xcodegen/bin" >> "$GITHUB_PATH"
          "${WORK_DIR}/xcodegen/bin/xcodegen" --version

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Verify release contract (pre-build)
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          VERIFY_RELEASE_ARTIFACTS: "0"
        run: bash scripts/verify-release-contract.sh

      - name: Build release artifacts
        run: bash scripts/ci-release-build.sh

      - name: Verify release contract (artifacts)
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          VERIFY_RELEASE_ARTIFACTS: "1"
        run: bash scripts/verify-release-contract.sh

      - name: Package downloads
        run: |
          bash scripts/package-dmg.sh
          cd build/Release
          # Marker must be created after ci-release-build (which promotes a fresh tree).
          printf '%s\n' \
            "UNNOTARIZED TEST BUILD — not for public distribution." \
            "This artifact is ad-hoc signed and has NOT been notarized by Apple." \
            > UNNOTARIZED_TEST_BUILD.txt
          ditto -c -k --sequesterRsrc --keepParent RazerMenuBarApp.app RazerMenuBarApp-macOS.zip
          # Add marker beside the app inside the app zip (ditto archived the .app only).
          zip -g RazerMenuBarApp-macOS.zip UNNOTARIZED_TEST_BUILD.txt
          zip -j RazerProbeCLI-macOS.zip RazerProbeCLI UNNOTARIZED_TEST_BUILD.txt
          shasum -a 256 RazerMenuBarApp-macOS.dmg *.zip UNNOTARIZED_TEST_BUILD.txt > SHA256SUMS.txt
          ls -la

      - name: Confirm unnotarized outputs remain quarantined
        run: |
          echo "UNNOTARIZED TEST BUILD: artifacts remain runner-local and are not published."
          echo "A future publisher must require Developer ID signing, notarization, and protected credentials."
