name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag matching MARKETING_VERSION (e.g. v1.0.2). Builds an unnotarized prerelease for that tag and publishes it on GitHub Releases."
        required: true
        # No default: forces an intentional tag that matches project.yml MARKETING_VERSION.


permissions:
  contents: write   # create/update GitHub Release + upload assets
  actions: write    # short-retention Actions artifact

env:
  XCODEGEN_VERSION: "2.45.4"
  # SHA-256 of https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
  XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
  RELEASE_ARCH: arm64

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout with full tag history
        # Pin to major v4 tag commit so Dependabot can still propose updates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release tag name
        id: tag
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.tag }}
          PUSH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_EVENT_NAME" in
            workflow_dispatch)
              TAG="$DISPATCH_RELEASE_TAG"
              ;;
            push)
              TAG="$PUSH_RELEASE_TAG"
              ;;
            *)
              printf 'error: unsupported release event: %q\n' "$RELEASE_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          bash scripts/validate-release-tag.sh "$TAG"
          printf 'name=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve release commit
        id: commit
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          bash scripts/validate-release-tag.sh "$TAG"

          # No git fetch: persist-credentials is false (private-repo auth would fail).
          # Checkout already used fetch-depth: 0 + fetch-tags: true.

          # Always build from the initially selected workflow commit so release
          # tooling matches the sources under test. Never check out a historical tag.
          INTENDED_SHA="$(git rev-parse HEAD)"
          TAG_REF="refs/tags/${TAG}"

          if git rev-parse -q --verify "$TAG_REF" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG_REF")"
            echo "Tag ${TAG} already exists at ${TAG_SHA}"
            if [ "$TAG_SHA" != "$INTENDED_SHA" ]; then
              echo "error: published tags are immutable" >&2
              echo "  ${TAG} points at ${TAG_SHA}" >&2
              echo "  workflow commit is ${INTENDED_SHA}" >&2
              echo "Cut a new version/tag from the commit you want to release." >&2
              exit 1
            fi
            echo "Tag ${TAG} matches this commit; continuing with the unnotarized prerelease build"
          else
            echo "error: tag ${TAG} does not exist at this workflow commit" >&2
            echo "This workflow never creates tags." >&2
            exit 1
          fi

          printf 'sha=%s\n' "$INTENDED_SHA" >> "$GITHUB_OUTPUT"
          echo "Building from $(git rev-parse HEAD) for tag ${TAG}"

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${WORK_DIR}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${WORK_DIR}/xcodegen.zip" | shasum -a 256 -c -
          unzip -qo "${WORK_DIR}/xcodegen.zip" -d "${WORK_DIR}"
          # Expose job-local binary so scripts/generate-xcodeproj.sh can find bare `xcodegen`.
          echo "${WORK_DIR}/xcodegen/bin" >> "$GITHUB_PATH"
          "${WORK_DIR}/xcodegen/bin/xcodegen" --version

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Verify release contract (pre-build)
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          VERIFY_RELEASE_ARTIFACTS: "0"
        run: bash scripts/verify-release-contract.sh

      - name: Build release artifacts
        run: bash scripts/ci-release-build.sh

      - name: Verify release contract (artifacts)
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          VERIFY_RELEASE_ARTIFACTS: "1"
        run: bash scripts/verify-release-contract.sh

      - name: Package downloads
        run: |
          bash scripts/package-dmg.sh
          cd build/Release
          # Marker must be created after ci-release-build (which promotes a fresh tree).
          printf '%s\n' \
            "UNNOTARIZED TEST BUILD — not for public distribution." \
            "This artifact is ad-hoc signed and has NOT been notarized by Apple." \
            > UNNOTARIZED_TEST_BUILD.txt
          ditto -c -k --sequesterRsrc --keepParent RazerMenuBarApp.app RazerMenuBarApp-macOS.zip
          # Add marker beside the app inside the app zip (ditto archived the .app only).
          zip -g RazerMenuBarApp-macOS.zip UNNOTARIZED_TEST_BUILD.txt
          zip -j RazerProbeCLI-macOS.zip RazerProbeCLI UNNOTARIZED_TEST_BUILD.txt
          shasum -a 256 RazerMenuBarApp-macOS.dmg *.zip UNNOTARIZED_TEST_BUILD.txt > SHA256SUMS.txt
          ls -la

      - name: Upload unnotarized test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UNNOTARIZED-TEST-BUILD
          path: |
            build/Release/RazerMenuBarApp-macOS.dmg
            build/Release/RazerMenuBarApp-macOS.zip
            build/Release/RazerProbeCLI-macOS.zip
            build/Release/SHA256SUMS.txt
            build/Release/UNNOTARIZED_TEST_BUILD.txt
          if-no-files-found: error
          retention-days: 7

      - name: Guard against clobbering an existing release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # softprops/action-gh-release UPDATES the release that already owns this
          # tag: it overrides name and prerelease with this workflow's inputs and
          # overwrites same-named assets. The "tag points at this commit" guard
          # above says nothing about releases, so without this probe a re-run (or a
          # workflow_dispatch) would silently rename a manually published NOTARIZED
          # release to "<tag> (unnotarized test build)", flip it to prerelease, and
          # replace its notarized .dmg/.zip with unnotarized ones.
          #
          # Read-only probe only: a plain GET, no mutating gh api flags, no
          # 'gh release', no ref-writing commands (see check-release-publisher.sh R6).
          UNNOTARIZED_SUFFIX="(unnotarized test build)"
          WORK_DIR="$(mktemp -d)"
          BODY_FILE="${WORK_DIR}/release.txt"
          ERR_FILE="${WORK_DIR}/error.txt"
          API_PATH="repos/${RELEASE_REPOSITORY}/releases/tags/${RELEASE_TAG}"

          # Draft releases are invisible to the tags endpoint (a draft has no
          # tag until published), but softprops adopts a same-tag draft and
          # overwrites its assets — rule one out first via the list endpoint.
          DRAFT_TAGS_FILE="${WORK_DIR}/draft-tags.txt"
          GH_STATUS=0
          gh api "repos/${RELEASE_REPOSITORY}/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft) | .tag_name // ""' \
            >"$DRAFT_TAGS_FILE" 2>"$ERR_FILE" || GH_STATUS=$?
          if [ "$GH_STATUS" -ne 0 ]; then
            echo "error: could not list releases to rule out a draft for ${RELEASE_TAG}" >&2
            cat "$ERR_FILE" >&2
            echo "Refusing to publish: an existing draft release cannot be ruled out." >&2
            exit 1
          fi
          if grep -Fxq "$RELEASE_TAG" "$DRAFT_TAGS_FILE"; then
            echo "error: a DRAFT release already targets ${RELEASE_TAG}." >&2
            echo "Publishing would adopt that draft and replace its assets with unnotarized ones." >&2
            echo "Publish or delete the draft deliberately, then re-run this workflow." >&2
            exit 1
          fi

          GH_STATUS=0
          gh api "$API_PATH" \
            --jq '"prerelease=\(.prerelease)", "name=\(.name // "")"' \
            >"$BODY_FILE" 2>"$ERR_FILE" || GH_STATUS=$?

          if [ "$GH_STATUS" -ne 0 ]; then
            # Fail closed: only a definite 404 means "no release yet". Auth, rate
            # limit and network failures must stop the job, never be read as absence.
            if grep -q 'HTTP 404' "$ERR_FILE"; then
              echo "No existing release for ${RELEASE_TAG}; this is the first publish for that tag."
              exit 0
            fi
            echo "error: could not determine whether ${RELEASE_TAG} already has a release" >&2
            cat "$ERR_FILE" >&2
            echo "Refusing to publish: an existing release cannot be ruled out." >&2
            exit 1
          fi

          EXISTING_PRERELEASE=""
          EXISTING_NAME=""
          while IFS= read -r LINE; do
            case "$LINE" in
              prerelease=*) EXISTING_PRERELEASE="${LINE#prerelease=}" ;;
              name=*) EXISTING_NAME="${LINE#name=}" ;;
            esac
          done < "$BODY_FILE"

          echo "Existing release for ${RELEASE_TAG}: prerelease=${EXISTING_PRERELEASE:-<unknown>} name=${EXISTING_NAME:-<empty>}"

          if [ "$EXISTING_PRERELEASE" = "true" ] &&
             [ "${EXISTING_NAME%"$UNNOTARIZED_SUFFIX"}" != "$EXISTING_NAME" ]; then
            echo "Existing release is this workflow's own unnotarized prerelease; re-publishing over it is expected."
            exit 0
          fi

          echo "error: ${RELEASE_TAG} already has a release this workflow must not overwrite." >&2
          echo "  prerelease: ${EXISTING_PRERELEASE:-<unknown>}" >&2
          echo "  name:       ${EXISTING_NAME:-<empty>}" >&2
          echo "Only a prerelease whose name ends with '${UNNOTARIZED_SUFFIX}' may be republished here." >&2
          echo "Publishing would rename that release, flip it to a prerelease, and replace its" >&2
          echo "assets with unnotarized ones — including a notarized build from scripts/sign-release.sh." >&2
          echo "If overwriting really is intended, delete the existing release deliberately" >&2
          echo "(Releases -> ${RELEASE_TAG} -> Delete release, keeping the tag) and re-run this workflow." >&2
          exit 1

      - name: Publish unnotarized GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }} (unnotarized test build)
          prerelease: true
          generate_release_notes: true
          body: |
            ## Unnotarized test build

            **Not** Developer ID signed and **not** notarized by Apple.
            macOS Gatekeeper may block first launch — right-click → Open, or System Settings → Privacy & Security → Open Anyway.

            ### Files
            - `RazerMenuBarApp-macOS.dmg` / `.zip`
            - `RazerProbeCLI-macOS.zip`
            - `SHA256SUMS.txt`
            - `UNNOTARIZED_TEST_BUILD.txt` marker

            Session-wide CGEvent remapper (not Razer-only). Official Gatekeeper-clean distribution still requires Apple Developer Program + `scripts/sign-release.sh`.
          files: |
            build/Release/RazerMenuBarApp-macOS.dmg
            build/Release/RazerMenuBarApp-macOS.zip
            build/Release/RazerProbeCLI-macOS.zip
            build/Release/SHA256SUMS.txt
            build/Release/UNNOTARIZED_TEST_BUILD.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Log-only summary. It asserts nothing — the publish contract is enforced
      # structurally by scripts/check-release-publisher.sh, not by this prose.
      - name: Log unnotarized build disclaimer
        run: |
          echo "UNNOTARIZED PRERELEASE: published on GitHub Releases (prerelease: true) + 7-day Actions artifact UNNOTARIZED-TEST-BUILD."
          echo "Still unnotarized — not a notarized production / Gatekeeper-clean release."
          echo "Official Gatekeeper-clean distribution still requires Apple Developer Program + scripts/sign-release.sh."
