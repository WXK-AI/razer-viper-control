name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  XCODEGEN_VERSION: "2.45.4"

jobs:
  scripts:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Verify release contract
        env:
          VERIFY_RELEASE_ARTIFACTS: "0"
        run: bash scripts/verify-release-contract.sh

  tests:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift tests
        run: swift test --disable-sandbox
