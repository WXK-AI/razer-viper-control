name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  XCODEGEN_VERSION: "2.45.4"

permissions:
  contents: read

jobs:
  scripts:
    runs-on: macos-15
    steps:
      - name: Checkout
        # Pin to major v4 tag commit so Dependabot can still propose updates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Verify release contract
        env:
          VERIFY_RELEASE_ARTIFACTS: "0"
        run: bash scripts/verify-release-contract.sh

  tests:
    runs-on: macos-15
    steps:
      - name: Checkout
        # Pin to major v4 tag commit so Dependabot can still propose updates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift tests
        run: swift test --disable-sandbox
